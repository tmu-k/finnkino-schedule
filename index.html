<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finnkino näytösajat</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f0f;
      color: #e8e8e8;
      min-height: 100vh;
    }

    header {
      padding: 0.75rem 1.5rem;
      border-bottom: 1px solid #222;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    header h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: -0.02em; white-space: nowrap; }
    header h1 span { color: #e5ac00; font-weight: 700; }
    footer { padding: 1.25rem 1.5rem; font-size: 0.72rem; color: #555; border-top: 1px solid #1a1a1a; }

    #stale-warning {
      display: none;
      padding: 0.6rem 1.5rem;
      background: #2d1f00;
      border-bottom: 1px solid #5a3d00;
      color: #f0c060;
      font-size: 0.8rem;
    }

    .date-tabs {
      display: flex;
      gap: 0.375rem;
    }

    .date-tab {
      background: none;
      border: 1px solid #333;
      color: #777;
      padding: 0.3rem 0.7rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.78rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1.25;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    .date-tab:hover { border-color: #555; color: #bbb; }
    .date-tab.active {
      border-color: #e5ac00;
      color: #e5ac00;
      background: rgba(229,172,0,0.08);
    }
    .tab-label { font-weight: 600; }
    .tab-sub   { font-size: 0.68rem; opacity: 0.75; }

    .date-tab-more {
      background: none;
      border: 1px solid #333;
      color: #777;
      padding: 0.3rem 0.5rem;
      border-radius: 6px;
      font-size: 0.78rem;
      cursor: pointer;
    }
    .date-tab-more:focus { outline: none; border-color: #555; }
    .date-tab-more.active { border-color: #e5ac00; color: #e5ac00; background: rgba(229,172,0,0.08); }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      border-bottom: 1px solid #222;
      background: #141414;
    }

    .filters select {
      background: #1e1e1e;
      border: 1px solid #333;
      color: #e8e8e8;
      padding: 0.375rem 0.625rem;
      border-radius: 6px;
      font-size: 0.8rem;
      min-width: 180px;
    }
    .filters select:focus { outline: none; border-color: #e5ac00; }

    .show-count { padding: 0.6rem 1.5rem; font-size: 0.75rem; color: #555; }

    .shows-grid {
      padding: 1rem 1.5rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 0.625rem;
    }

    .show-card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 0.625rem 0.875rem;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      transition: border-color 0.15s;
    }
    .show-card:hover { border-color: #444; }

    .show-time { font-size: 1.1rem; font-weight: 700; color: #fff; letter-spacing: -0.03em; }
    .show-time .end { font-size: 0.8rem; font-weight: 400; color: #666; margin-left: 0.35rem; }
    .show-title { font-size: 0.875rem; font-weight: 600; color: #f0f0f0; line-height: 1.3; }
    .show-title a { color: inherit; text-decoration: none; }
    .show-title a:hover { color: #e5ac00; }
    .show-orig { font-size: 0.75rem; color: #666; }
    .show-meta { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.15rem; }

    .tag {
      font-size: 0.7rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      background: #252525;
      color: #aaa;
      border: 1px solid #333;
    }
    .tag.theater { color: #7eb8f7; border-color: #2a4a6a; background: #1a2d40; }
    .tag.theater a { color: inherit; text-decoration: none; }
    .tag.theater a:hover { color: #e5ac00; }
    .tag.hall   { color: #9e9e9e; }
    .tag.attr   { color: #a0e0a0; border-color: #2a4a2a; background: #1a2d1a; }
    .tag.rating { color: #f0c060; border-color: #4a3a1a; background: #2d2010; }

    #empty {
      padding: 2rem 1.5rem;
      color: #555;
      font-size: 0.875rem;
    }

    @media (max-width: 600px) {
      header, .filters, .shows-grid, .show-count, #empty { padding-left: 1rem; padding-right: 1rem; }
      .shows-grid { grid-template-columns: 1fr; }
      footer { padding-left: 1rem; padding-right: 1rem; }
    }

    @media (max-width: 390px) {
      header, .filters, .shows-grid, .show-count, #empty, footer { padding-left: 0.5rem; padding-right: 0.5rem; }
      header { gap: 0.5rem; }
      .date-tab { padding: 0.25rem 0.45rem; }
      .date-tab-more { padding: 0.25rem 0.35rem; }
    }
  </style>
</head>

02","filmId":"HO00000413","showtimeId":"1102-5618"},{"start":"13:00","end":"14:28","title":"Ryhmä Hau: Dinoelokuva","originalTitle":"","theater":"Scala Kuopio","hall":"Sali 1","attrs":"2D","rating":"K-7","siteId":"1150","filmId":"HO00000413","showtimeId":"1150-6942"},{"start":"13:00","end":"14:28","title":"Ryhmä Hau: Dinoelokuva","originalTitle":"","theater":"LUXE Mylly Raisio","hall":"LUXE iSense","attrs":"2D · iSense · LUXE","rating":"K-7","siteId":"1166","filmId":"HO00000413","showtimeId":"1166-6109"},{"start":"13:10","end":"14:38","title":"Ryhmä Hau: Dinoelokuva","originalTitle":"","theater":"Fantasia Jyväskylä","hall":"Sali 1","attrs":"2D","rating":"K-7","siteId":"1095","filmId":"HO00000413","showtimeId":"1095-6258"},{"start":"13:30","end":"14:58","title":"Ryhmä Hau: Dinoelokuva","originalTitle":"","theater":"Cine Atlas Tampere","hall":"Sali 1","attrs":"2D","rating":"K-7","siteId":"1094","filmId":"HO00000413","showtimeId":"1094-3161"},{"start":"13:30","end":"14:58","title":"Ryhmä Hau: Dinoelokuva","originalTitle":"","theater":"Tennispalatsi Helsinki","hall":"Sali 5","attrs":"2D","rating":"K-7","siteId":"1111","filmId":"HO00000413","showtimeId":"1111-19876"},{"start":"13:30","end":"14:58","title":"Ryhmä Hau: Dinoelokuva","originalTitle":"","theater":"Strand Lappeenranta","hall":"Sali 1","attrs":"2D","rating":"K-7","siteId":"1155","filmId":"HO00000413","showtimeId":"1155-3542"},{"start":"13:30","end":"14:58","title":"Ryhmä Hau: Dinoelokuva","originalTitle":"","theater":"Itis Helsinki","hall":"Sali 2","attrs":"2D","rating":"K-7","siteId":"1162","filmId":"HO00000413","showtimeId":"1162-9245"},{"start":"15:45","end":"18:10","title":"Spider-Man: Brand New Day","originalTitle":"","theater":"Promenadi Pori","hall":"Sali 1","attrs":"2D","rating":"K-12","siteId":"1004","filmId":"HO00000414","showtimeId":"1004-3977"},{"start":"15:45","end":"18:10","title":"Spider-Man: Brand New Day","originalTitle":"","theater":"LUXE Mylly Raisio","hall":"LUXE iSense","attrs":"2D · iSense · LUXE","rating":"K-12","siteId":"1166","filmId":"HO00000414","showtimeId":"1166-5433"},{"start":"15:50","end":"18:15","title":"Spider-Man: Brand New Day","originalTitle":"","theater":"Fantasia Jyväskylä","hall":"Sali 1","attrs":"2D","rating":"K-12","siteId":"1095","filmId":"HO00000414","showtimeId":"1095-5511"},{"start":"15:50","end":"18:15","title":"Spider-Man: Brand New Day","originalTitle":"","theater":"Kuvapalatsi Lahti","hall":"Sali 1","attrs":"2D","rating":"K-12","siteId":"1102","filmId":"HO00000414","showtimeId":"1102-5016"},{"start":"15:50","end":"18:15","title":"Spider-Man: Brand New Day","originalTitle":"","theater":"Scala Kuopio","hall":"Sali 1","attrs":"2D","rating":"K-12","siteId":"1150","filmId":"HO00000414","showtimeId":"1150-6256"},{"start":"16:00","end":"18:25","title":"Spider-Man: Brand New Day","originalTitle":"","theater":"Strand Lappeenranta","hall":"Sali 1","attrs":"2D","rating":"K-12","siteId":"1155","filmId":"HO00000414","showtimeId":"1155-3189"},{"start":"16:45","end":"19:10","title":"Spider-Man: Brand New Day","originalTitle":"","theater":"Itis Helsinki","hall":"Sali 2","attrs":"2D · Anniskelu","rating":"K-12","siteId":"1162","filmId":"HO00000414","showtimeId":"1162-8134"},{"start":"17:00","end":"19:25","title":"Spider-Man: Brand New Day","originalTitle":"","theater":"Plaza Oulu","hall":"LUXE","attrs":"2D · Anniskelu · LUXE","rating":"K-12","siteId":"1107","filmId":"HO00000414","showtimeId":"1107-7161"},{"start":"17:15","end":"19:40","title":"Spider-Man: Brand New Day","originalTitle":"","theater":"Sello Espoo","hall":"Sali 1","attrs":"2D · Anniskelu","rating":"K-12","siteId":"1151","filmId":"HO00000414","showtimeId":"1151-7289"},{"start":"17:30","end":"19:55","title":"Spider-Man: Brand New Day","originalTitle":"","theater":"Kinopalatsi Turku","hall":"iSense","attrs":"2D · iSense","rating":"K-12","siteId":"1101","filmId":"HO00000414","showtimeId":"1101-8846"},{"start":"17:30","end":"19:55","title":"Spider-Man: Brand New Day","originalTitle":"","theater":"Plevna Tampere","hall":"iSense","attrs":"2D · iSense","rating":"K-12","siteId":"1108","filmId":"HO00000414","showtimeId":"1108-11282"},{"start":"17:30","end":"19:55","title":"Spider-Man: Brand New Day","originalTitle":"","theater":"Tennispalatsi Helsinki","hall":"iSense","attrs":"2D · Anniskelu · iSense","rating":"K-12","siteId":"1111","filmId":"HO00000414","showtimeId":"1111-17854"},{"start":"17:30","end":"19:55","title":"Spider-Man: Brand New Day","originalTitle":"","theater":"Omena Espoo","hall":"iSense","attrs":"2D · Anniskelu · iSense","rating":"K-12","siteId":"1157","filmId":"HO00000414","showtimeId":"1157-8215"},{"start":"17:45","end":"20:10","title":"Spider-Man: Brand New Day","originalTitle":"","theater":"Flamingo Vantaa","hall":"Sali 1","attrs":"2D · Anniskelu","rating":"K-12","siteId":"1140","filmId":"HO00000414","showtimeId":"1140-6477"}]};
const DATES         = ["2026-07-24", "2026-07-25", "2026-07-26", "2026-07-27", "2026-07-28", "2026-07-29", "2026-07-30", "2026-07-31", "2026-08-01", "2026-08-02"];
const SITES         = [{"id":"1004","name":"Promenadi Pori"},{"id":"1094","name":"Cine Atlas Tampere"},{"id":"1095","name":"Fantasia Jyväskylä"},{"id":"1100","name":"Kinopalatsi Helsinki"},{"id":"1101","name":"Kinopalatsi Turku"},{"id":"1102","name":"Kuvapalatsi Lahti"},{"id":"1103","name":"Maxim Helsinki"},{"id":"1107","name":"Plaza Oulu"},{"id":"1108","name":"Plevna Tampere"},{"id":"1111","name":"Tennispalatsi Helsinki"},{"id":"1140","name":"Flamingo Vantaa"},{"id":"1150","name":"Scala Kuopio"},{"id":"1151","name":"Sello Espoo"},{"id":"1155","name":"Strand Lappeenranta"},{"id":"1157","name":"Omena Espoo"},{"id":"1162","name":"Itis Helsinki"},{"id":"1166","name":"LUXE Mylly Raisio"}];
const THEATER_URLS  = {"Cine Atlas Tampere": "finnkino-cine-atlas", "Fantasia Jyväskylä": "finnkino-fantasia", "Flamingo Vantaa": "finnkino-flamingo", "Itis Helsinki": "finnkino-itis", "Kinopalatsi Helsinki": "finnkino-kinopalatsi-helsinki", "Kinopalatsi Turku": "finnkino-kinopalatsi-turku", "Kuvapalatsi Lahti": "finnkino-kuvapalatsi", "LUXE Mylly Raisio": "finnkino-luxe-mylly", "Maxim Helsinki": "finnkino-maxim", "Omena Espoo": "finnkino-omena", "Plaza Oulu": "finnkino-plaza", "Plevna Tampere": "finnkino-plevna", "Promenadi Pori": "finnkino-promenadi", "Scala Kuopio": "finnkino-scala", "Sello Espoo": "finnkino-sello", "Strand Lappeenranta": "finnkino-strand", "Tennispalatsi Helsinki": "finnkino-tennispalatsi"};

const DAY_LABELS = ['Tänään', 'Huomenna', 'Ylihuomenna'];
const FI_WEEKDAYS = ['su','ma','ti','ke','to','pe','la'];

const tabsEl        = document.getElementById('date-tabs');
const theaterSelect = document.getElementById('theater-select');
const movieSelect   = document.getElementById('movie-select');
const showsGrid     = document.getElementById('shows-grid');
const showCount     = document.getElementById('show-count');
const emptyEl       = document.getElementById('empty');

// Default to first date that has shows; fall back to today
let activeDate = DATES.find(d => SHOWS_BY_DATE[d].length > 0) || DATES[0];

// Build date-tab buttons for first 3 days, date picker for the rest
DATES.slice(0, 3).forEach((d, i) => {
  const [y, m, day] = d.split('-').map(Number);
  const weekday = FI_WEEKDAYS[new Date(y, m - 1, day).getDay()];
  const btn = document.createElement('button');
  btn.className = 'date-tab' + (d === activeDate ? ' active' : '');
  btn.dataset.date = d;
  btn.innerHTML = `<span class="tab-label">${DAY_LABELS[i]}</span>`
                + `<span class="tab-sub">${weekday} ${day}.${m}.</span>`;
  btn.addEventListener('click', () => { activeDate = d; extraDateSel.value = ''; update(); });
  tabsEl.appendChild(btn);
});

// Extra date picker for days 3–6 that have shows
const extraDates = DATES.slice(3).filter(d => SHOWS_BY_DATE[d].length > 0);
const extraDateSel = document.createElement('select');
extraDateSel.className = 'date-tab-more' + (extraDates.includes(activeDate) ? ' active' : '');
extraDateSel.innerHTML = '<option value="">···</option>';
extraDates.forEach(d => {
  const [y, m, day] = d.split('-').map(Number);
  const weekday = FI_WEEKDAYS[new Date(y, m - 1, day).getDay()];
  const o = document.createElement('option');
  o.value = d;
  o.textContent = `${weekday} ${day}.${m}.`;
  if (d === activeDate) o.selected = true;
  extraDateSel.appendChild(o);
});
extraDateSel.addEventListener('change', () => {
  if (!extraDateSel.value) return;
  activeDate = extraDateSel.value;
  update();
});
if (extraDates.length) tabsEl.appendChild(extraDateSel);

// Theater groups — selectable at the top of the dropdown
const THEATER_GROUPS = [
  { label: 'Pääkaupunkiseudun ohjelmisto', names: ['Flamingo Vantaa','Itis Helsinki','Kinopalatsi Helsinki','Maxim Helsinki','Omena Espoo','Sello Espoo','Tennispalatsi Helsinki'] },
  { label: 'Tampereen ohjelmisto',         names: ['Cine Atlas Tampere','Plevna Tampere'] },
  { label: 'Turun ja Raision ohjelmisto',  names: ['Kinopalatsi Turku','LUXE Mylly Raisio'] },
];
const allSiteIds   = new Set(DATES.flatMap(d => SHOWS_BY_DATE[d].map(s => s.siteId)));
const availSites   = SITES.filter(s => allSiteIds.has(s.id));
const nameToId     = Object.fromEntries(availSites.map(s => [s.name, s.id]));
const groupedNames = new Set(THEATER_GROUPS.flatMap(g => g.names));

// Group options at the top
const ogGroups = document.createElement('optgroup');
ogGroups.label = 'Alueet';
THEATER_GROUPS.forEach(group => {
  const memberIds = group.names.map(n => nameToId[n]).filter(Boolean);
  if (!memberIds.length) return;
  const o = document.createElement('option');
  o.value = 'g:' + group.label;
  o.textContent = group.label;
  o.dataset.siteids = memberIds.join(',');
  ogGroups.appendChild(o);
});
theaterSelect.appendChild(ogGroups);

// Individual theaters below
const ogSingle = document.createElement('optgroup');
ogSingle.label = 'Teatterit';
availSites.sort((a, b) => a.name.localeCompare(b.name, 'fi')).forEach(s => {
  const o = document.createElement('option');
  o.value = s.id; o.textContent = s.name;
  ogSingle.appendChild(o);
});
theaterSelect.appendChild(ogSingle);

// Returns a Set of siteIds for the current selection, or null for "all"
function getFilterIds() {
  const val = theaterSelect.value;
  if (!val) return null;
  if (val.startsWith('g:')) {
    const ids = theaterSelect.options[theaterSelect.selectedIndex].dataset.siteids.split(',');
    return new Set(ids);
  }
  return new Set([val]);
}

function theaterUrl(name) {
  const slug = THEATER_URLS[name];
  return slug ? `https://www.finnkino.fi/teatterit/${slug}/` : null;
}

function updateTabs() {
  tabsEl.querySelectorAll('.date-tab').forEach(btn =>
    btn.classList.toggle('active', btn.dataset.date === activeDate)
  );
  const isExtra = extraDates.includes(activeDate);
  extraDateSel.classList.toggle('active', isExtra);
  if (!isExtra) extraDateSel.value = '';
}

function updateMovieDropdown() {
  const ids     = getFilterIds();
  const shows   = SHOWS_BY_DATE[activeDate];
  const visible = ids ? shows.filter(s => ids.has(s.siteId)) : shows;
  const prev    = movieSelect.value;
  const titles  = [...new Set(visible.map(s => s.title))].sort((a, b) => a.localeCompare(b, 'fi'));
  movieSelect.innerHTML = '<option value="">Kaikki elokuvat</option>';
  titles.forEach(t => {
    const o = document.createElement('option');
    o.value = t; o.textContent = t;
    movieSelect.appendChild(o);
  });
  movieSelect.value = titles.includes(prev) ? prev : '';
}

function render() {
  const ids    = getFilterIds();
  const title  = movieSelect.value;
  let filtered = SHOWS_BY_DATE[activeDate];
  if (ids)   filtered = filtered.filter(s => ids.has(s.siteId));
  if (title)  filtered = filtered.filter(s => s.title  === title);

  showsGrid.innerHTML = '';
  if (filtered.length === 0) {
    showCount.textContent = '';
    emptyEl.hidden = false;
    return;
  }
  emptyEl.hidden = true;
  showCount.textContent = `${filtered.length} näytöstä`;

  filtered.forEach(s => {
    const url = theaterUrl(s.theater);
    const theaterTag = url
      ? `<a href="${url}" target="_blank" rel="noopener">${s.theater}</a>`
      : s.theater;
    const card = document.createElement('div');
    card.className = 'show-card';
    card.innerHTML = `
      <div class="show-time">${s.start}<span class="end">→ ${s.end}</span></div>
      <div class="show-title">${s.showtimeId
        ? `<a href="https://www.finnkino.fi/liput/valitse-paikat/?showtimeId=${s.showtimeId}" target="_blank" rel="noopener">${s.title}</a>`
        : s.title}</div>
      ${s.originalTitle && s.originalTitle !== s.title
        ? `<div class="show-orig">${s.originalTitle}</div>` : ''}
      <div class="show-meta">
        ${s.theater ? `<span class="tag theater">${theaterTag}</span>` : ''}
        ${s.hall    ? `<span class="tag hall">${s.hall}</span>` : ''}
        ${s.attrs   ? `<span class="tag attr">${s.attrs}</span>` : ''}
        ${s.rating  ? `<span class="tag rating">${s.rating}</span>` : ''}
      </div>`;
    showsGrid.appendChild(card);
  });
}

function update() {
  updateTabs();
  updateMovieDropdown();
  render();
}

// Restore saved theater selection
const savedTheater = localStorage.getItem('finnkino-theater');
if (savedTheater) theaterSelect.value = savedTheater;

// Staleness warning
const GENERATED_AT = new Date("2026-07-24T06:30:09.929227+03:00");
const hoursOld = (Date.now() - GENERATED_AT) / 3600000;
if (hoursOld >= 2) {
  const w = document.getElementById('stale-warning');
  w.textContent = `⚠️ Tiedot saattavat olla vanhentuneita — päivitetty ${Math.floor(hoursOld)}h sitten`;
  w.style.display = 'block';
}

theaterSelect.addEventListener('change', () => {
  localStorage.setItem('finnkino-theater', theaterSelect.value);
  updateMovieDropdown();
  render();
});
movieSelect.addEventListener('change', render);

update();
</script>
</body>
</html>
